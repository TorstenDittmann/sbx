name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test -count=1 -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
      - name: install script
        run: |
          sh -n install.sh
          sh install.sh --self-test
          sh install.sh --print-target | grep -qx 'os=linux'
      - name: coverage
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo "### Go coverage"
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          awk '/^total:/ { gsub("%","",$NF); if ($NF+0 < 80) { print "coverage " $NF "% is below 80%"; exit 1 } }' coverage.txt

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build agent
        run: CGO_ENABLED=0 go build -o /tmp/sbx-agent ./cmd/sbx-agent
      - name: docker integration
        run: SBX_INTEGRATION=1 SBX_AGENT_BIN=/tmp/sbx-agent go test -count=1 -timeout 20m ./internal/driver/docker/ ./test/e2e/

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: sdk tests
        run: npm test --prefix sdk/typescript
      - name: example parses
        run: node --experimental-strip-types --check examples/quickstart.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: sdk tests on bun
        run: bun test --cwd sdk/typescript test
      - name: build sdk package
        run: npm ci --prefix sdk/typescript
      - name: sdk package contents
        working-directory: sdk/typescript
        run: |
          npm pack --dry-run > /tmp/sbx-pack.txt 2>&1
          grep -q 'dist/index.js' /tmp/sbx-pack.txt
          grep -q 'dist/index.d.ts' /tmp/sbx-pack.txt
          if grep -R '\.ts"' dist; then
            echo "published ESM still imports .ts files" >&2
            exit 1
          fi
      - name: sdk package loads on node and bun
        run: |
          node --input-type=module -e 'import { parseDuration, Sandbox, SbxClient } from "./sdk/typescript/dist/index.js"; if (parseDuration("5m") !== 300) process.exit(1); if (typeof Sandbox.create !== "function" || typeof SbxClient !== "function") process.exit(1)'
          bun -e 'import { parseDuration, Sandbox, SbxClient } from "./sdk/typescript/dist/index.js"; if (parseDuration("5m") !== 300) process.exit(1); if (typeof Sandbox.create !== "function" || typeof SbxClient !== "function") process.exit(1)'
          bun test --cwd sdk/typescript test

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build site image
        run: docker build -t sbx-website ./website
