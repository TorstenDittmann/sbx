name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: unit tests
        run: go test -count=1 -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...
      - name: install script
        run: |
          sh -n install.sh
          sh install.sh --self-test
          sh install.sh --print-target | grep -qx 'os=linux'
      - name: coverage
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo "### Go coverage"
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          awk '/^total:/ { gsub("%","",$NF); if ($NF+0 < 80) { print "coverage " $NF "% is below 80%"; exit 1 } }' coverage.txt

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: build agent
        run: CGO_ENABLED=0 go build -o /tmp/sbx-agent ./cmd/sbx-agent
      - name: install gvisor
        run: |
          set -euo pipefail
          ARCH=$(uname -m)
          TAG=$(curl -fsSL https://api.github.com/repos/google/gvisor/releases/latest | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n 1)
          test -n "$TAG"
          curl -fsSL -o "gvisor-${ARCH}.tar.bz2" "https://github.com/google/gvisor/releases/download/${TAG}/gvisor-${ARCH}.tar.bz2"
          curl -fsSL -o SHA512SUMS "https://github.com/google/gvisor/releases/download/${TAG}/SHA512SUMS"
          grep "gvisor-${ARCH}.tar.bz2" SHA512SUMS | sha512sum -c
          tar -xf "gvisor-${ARCH}.tar.bz2" runsc containerd-shim-runsc-v1
          chmod a+rx runsc containerd-shim-runsc-v1
          sudo mv runsc containerd-shim-runsc-v1 /usr/local/bin
          # host netstack uses the namespace Docker already set up, so DNS and the sbx bridge apply.
          sudo runsc install -- --network=host
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      - name: docker integration
        run: SBX_INTEGRATION=1 SBX_AGENT_BIN=/tmp/sbx-agent go test -count=1 -timeout 40m ./internal/driver/docker/ ./test/e2e/

  kata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: kata integration
        run: |
          set -euo pipefail
          if [ ! -w /dev/kvm ]; then
            echo "no writable /dev/kvm; skipping Kata boot"
            exit 0
          fi
          if ! docker info --format '{{json .Runtimes}}' | grep -q kata; then
            echo "Kata runtime class is not registered on this runner; skipping boot"
            echo "Install containerd-shim-kata-v2 and run: sbx setup kata --apply"
            exit 0
          fi
          CGO_ENABLED=0 go build -o /tmp/sbx-agent ./cmd/sbx-agent
          SBX_KATA_INTEGRATION=1 SBX_AGENT_BIN=/tmp/sbx-agent go test -count=1 -timeout 20m ./internal/driver/kata/ -run TestIntegrationBoot -v

  firecracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: firecracker integration
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "no /dev/kvm; skipping Firecracker boot"
            exit 0
          fi
          if [ ! -w /dev/kvm ] && ! sudo -n test -w /dev/kvm; then
            echo "/dev/kvm is not writable; skipping Firecracker boot"
            exit 0
          fi
          if [ "$(id -u)" -ne 0 ] && ! sudo -n true; then
            echo "root or passwordless sudo is required to mount the ext4 rootfs; skipping"
            exit 0
          fi
          sudo modprobe kvm 2>/dev/null || true
          sudo modprobe kvm_intel 2>/dev/null || true
          sudo modprobe kvm_amd 2>/dev/null || true
          sudo modprobe vhost_vsock 2>/dev/null || true
          CGO_ENABLED=0 go build -o /tmp/sbx-agent ./cmd/sbx-agent
          chmod 755 /tmp/sbx-agent
          set +e
          if [ "$(id -u)" -eq 0 ]; then
            SBX_FC_INTEGRATION=1 SBX_AGENT_BIN=/tmp/sbx-agent go test -count=1 -timeout 30m ./internal/driver/firecracker/ -run TestIntegrationBoot -v > /tmp/fc-test.log 2>&1
          else
            sudo -E env PATH="$PATH" GOCACHE=/tmp/sbx-go-cache GOMODCACHE=/tmp/sbx-go-mod \
              SBX_FC_INTEGRATION=1 SBX_AGENT_BIN=/tmp/sbx-agent \
              go test -count=1 -timeout 30m ./internal/driver/firecracker/ -run TestIntegrationBoot -v > /tmp/fc-test.log 2>&1
          fi
          code=$?
          set -e
          cat /tmp/fc-test.log
          if [ "$code" -ne 0 ]; then
            python3 -c 'from pathlib import Path; t=Path("/tmp/fc-test.log").read_text(errors="replace")[-3500:]; t=t.replace("%","%25").replace("\r","").replace("\n"," | "); print("::error::"+t)'
            exit "$code"
          fi

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: sdk tests
        run: npm test --prefix sdk/typescript
      - name: example parses
        run: node --experimental-strip-types --check examples/quickstart.ts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - name: sdk tests on bun
        run: bun test --cwd sdk/typescript test
      - name: build sdk package
        run: npm ci --prefix sdk/typescript
      - name: sdk package contents
        working-directory: sdk/typescript
        run: |
          npm pack --dry-run > /tmp/sbx-pack.txt 2>&1
          grep -q 'dist/index.js' /tmp/sbx-pack.txt
          grep -q 'dist/index.d.ts' /tmp/sbx-pack.txt
          if grep -R '\.ts"' dist; then
            echo "published ESM still imports .ts files" >&2
            exit 1
          fi
      - name: sdk package loads on node and bun
        run: |
          node --input-type=module -e 'import { parseDuration, Sandbox, SbxClient } from "./sdk/typescript/dist/index.js"; if (parseDuration("5m") !== 300) process.exit(1); if (typeof Sandbox.create !== "function" || typeof SbxClient !== "function") process.exit(1)'
          bun -e 'import { parseDuration, Sandbox, SbxClient } from "./sdk/typescript/dist/index.js"; if (parseDuration("5m") !== 300) process.exit(1); if (typeof Sandbox.create !== "function" || typeof SbxClient !== "function") process.exit(1)'
          bun test --cwd sdk/typescript test

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: sdk tests
        working-directory: sdk/python
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v
      - name: example compiles
        run: python -m py_compile examples/quickstart.py
      - name: build and install the wheel
        working-directory: sdk/python
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel-venv/bin/python -c 'from sbx import Sandbox, SbxClient, parse_duration; assert parse_duration("5m") == 300; assert callable(Sandbox.create) and SbxClient'
      - name: types
        if: matrix.python == '3.13'
        working-directory: sdk/python
        run: |
          python -m pip install mypy websockets
          mypy --strict src/sbx

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build site image
        run: docker build -t sbx-website ./website
