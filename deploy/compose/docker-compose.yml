services:
  sbx:
    build:
      context: ../..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SBX_ADDR: ":8080"
      SBX_DATA_DIR: /data
    volumes:
      - ../../data:/data
      # The socket is how sbx creates sandboxes. network=full also uses it to
      # install host firewall rules when the server itself cannot run iptables.
      - /var/run/docker.sock:/var/run/docker.sock
