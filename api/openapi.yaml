openapi: 3.1.0
info:
  title: sbx
  version: 0.2.0
  summary: Single-node sandbox API.
  description: |
    HTTP API for creating and using isolated sandboxes. Authenticate with
    `Authorization: Bearer sbx_<key>`. Browsers and WebSocket clients may pass
    the same key as the `access_token` query parameter. The first boot of a
    data directory generates an admin key and prints it once.
    When `sbx-agent` is configured, processes, terminals, file watch, and
    previews are available. Without it those routes return `unsupported`.
servers:
  - url: http://127.0.0.1:8080
    description: Local default bind.
security:
  - bearerAuth: []
  - accessToken: []
paths:
  /:
    get:
      security: []
      operationId: root
      summary: Service identity
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                type: object
                required: [name, version]
                properties:
                  name: {type: string}
                  version: {type: string}
                  health: {type: string}
                  openapi: {type: string}
  /healthz:
    get:
      security: []
      operationId: health
      summary: Liveness and Docker reachability
      responses:
        "200":
          description: Docker is reachable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        "503":
          description: Docker is unreachable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
  /readyz:
    get:
      security: []
      operationId: ready
      summary: Readiness after startup reconciliation
      description: |
        Returns 503 until the process has finished adopting or retiring
        sandboxes from a previous run, and when Docker does not answer.
        Use `/healthz` for liveness.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        "503":
          description: Still starting, or Docker is unreachable
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
  /metrics:
    get:
      security: []
      operationId: metrics
      summary: Prometheus text metrics
      responses:
        "200":
          description: Metrics
          content:
            text/plain:
              schema: {type: string}
  /openapi.yaml:
    get:
      security: []
      operationId: openapi
      summary: This document
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema: {type: string}
  /v1/keys:
    get:
      operationId: listKeys
      summary: List API keys
      responses:
        "200":
          description: Keys without secrets
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: {$ref: "#/components/schemas/APIKey"}
    post:
      operationId: createKey
      summary: Create an API key
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateKey"}
      responses:
        "201":
          description: Key created. The secret is returned once.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedKey"}
  /v1/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getKey
      summary: Get one API key
      responses:
        "200":
          description: Key without its secret
          content:
            application/json:
              schema: {$ref: "#/components/schemas/APIKey"}
        "404": {description: Not found}
    delete:
      operationId: revokeKey
      summary: Revoke an API key
      description: >
        The key stops authenticating immediately. Revoking twice keeps the
        first revoked_at. Sandboxes and volumes the key owns are left for an
        admin to inspect or delete. The last usable admin key cannot be
        revoked through the API (409); `sbx keys revoke` on the host can.
      responses:
        "204": {description: Revoked}
        "404": {description: Not found}
        "409": {description: This is the last usable admin key}
  /v1/backends:
    get:
      operationId: listBackends
      summary: Report which isolation backends this server can run
      responses:
        "200":
          description: One row per ladder rung
          content:
            application/json:
              schema:
                type: object
                required: [backends]
                properties:
                  backends:
                    type: array
                    items: {$ref: "#/components/schemas/Backend"}
  /v1/templates:
    get:
      operationId: listTemplates
      summary: List templates
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items: {$ref: "#/components/schemas/Template"}
    post:
      operationId: createTemplate
      summary: Create a template
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTemplate"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Template"}
  /v1/builds:
    post:
      operationId: createBuild
      summary: Build and cache an image from steps
      description: >
        Runs the steps on the base image and tags the result by a hash of the
        base and the steps. A second call with the same input returns the
        cached image with 200. A sandbox create with the same image (or
        template) and steps starts from that image. Steps run as root in
        Docker's builder with the daemon's default network. An admin key is
        required unless the server sets builds.allow_sandbox_keys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image: {type: string, description: Base image. Defaults to the template's image.}
                template: {type: string, description: Template whose image and steps come first.}
                steps:
                  type: array
                  items: {$ref: "#/components/schemas/BuildStep"}
                backend: {type: string, description: Backend whose daemon builds the image.}
      responses:
        "200":
          description: Already cached
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Build"}
        "201":
          description: Built
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Build"}
        "403":
          description: Builds need an admin key
  /v1/templates/{name}:
    delete:
      operationId: deleteTemplate
      summary: Delete a user template
      parameters:
        - $ref: "#/components/parameters/TemplateName"
      responses:
        "204": {description: Deleted}
  /v1/volumes:
    get:
      operationId: listVolumes
      summary: List volumes owned by the caller
      description: >
        An admin key sees every volume. A sandbox key sees only volumes it
        created. Volumes outlive sandboxes.
      responses:
        "200":
          description: Volumes visible to the caller
          content:
            application/json:
              schema:
                type: object
                required: [volumes]
                properties:
                  volumes:
                    type: array
                    items: {$ref: "#/components/schemas/Volume"}
    post:
      operationId: createVolume
      summary: Create a named volume
      description: >
        Creates a Docker volume for the caller's backend. The name is unique
        per API key. The volume is not deleted when a sandbox that mounts it
        is deleted. A name the key already uses fails with 409 unless
        if_exists is reuse, which returns the existing volume with 200.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateVolume"}
      responses:
        "201":
          description: Created volume
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Volume"}
        "200":
          description: Existing volume, returned when if_exists is reuse
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Volume"}
  /v1/volumes/{id}:
    get:
      operationId: getVolume
      summary: Get a volume
      parameters:
        - $ref: "#/components/parameters/VolumeID"
      responses:
        "200":
          description: Volume
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Volume"}
    delete:
      operationId: deleteVolume
      summary: Delete a volume
      description: >
        Fails with 409 while a creating, running, or paused sandbox mounts the
        volume. A stopped sandbox does not keep the volume.
      parameters:
        - $ref: "#/components/parameters/VolumeID"
      responses:
        "204": {description: Deleted}
  /v1/sandboxes:
    get:
      operationId: listSandboxes
      summary: List sandboxes
      description: >
        Warm-pool sandboxes are omitted unless an admin asks for status=warm.
      parameters:
        - in: query
          name: status
          schema: {type: string}
        - in: query
          name: backend
          schema: {type: string}
        - in: query
          name: template
          schema: {type: string}
          description: Exact template name.
        - in: query
          name: label
          description: Repeatable key:value filter. All must match.
          schema: {type: string}
        - in: query
          name: q
          schema: {type: string, maxLength: 128}
          description: >
            Case-insensitive substring matched against id, template, image,
            status, and label keys and values. Combined with the exact filters.
      responses:
        "200":
          description: Sandboxes visible to the caller
          content:
            application/json:
              schema:
                type: object
                properties:
                  sandboxes:
                    type: array
                    items: {$ref: "#/components/schemas/Sandbox"}
    post:
      operationId: createSandbox
      summary: Create a sandbox
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSandbox"}
      responses:
        "201":
          description: Running sandbox
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
  /v1/sandboxes/{id}:
    get:
      operationId: getSandbox
      summary: Get a sandbox
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Sandbox
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
    delete:
      operationId: deleteSandbox
      summary: Stop and remove a sandbox
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Sandbox after it was stopped
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
  /v1/sandboxes/{id}/timeout:
    post:
      operationId: setSandboxTimeout
      summary: Set the remaining lifetime
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ttl_seconds]
              properties:
                ttl_seconds: {type: integer, minimum: 1}
      responses:
        "200":
          description: Updated sandbox
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
  /v1/sandboxes/{id}/secrets:
    put:
      operationId: setSandboxSecrets
      summary: Replace sandbox secrets
      description: >
        Replaces the secret map. Values are not echoed. Later execs and new
        processes see the new values. The container's original environment is
        unchanged, so a shell that was already running keeps the old values.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secrets]
              properties:
                secrets: {type: object, additionalProperties: {type: string}}
      responses:
        "200":
          description: Sandbox with secret_keys and no secret values
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
  /v1/sandboxes/{id}/pause:
    post:
      operationId: pauseSandbox
      summary: Pause a sandbox
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Paused sandbox
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
  /v1/sandboxes/{id}/snapshot:
    post:
      operationId: snapshotSandbox
      summary: Commit a running sandbox to an image
      description: >
        Commits the sandbox to sbx-template:<id> so a prepared environment
        can be forked. Root filesystem changes and the contents of
        /workspace are kept (/workspace is skipped when a volume is mounted
        there). Secrets are not: env keys the sandbox added on top of the
        base image are kept with empty values, because Docker cannot unset
        them. Pass the image to a create, or set template to also save it as
        a template that copies the sandbox's cpu, memory, disk, env,
        backend, and network. Needs the same rights as a build; saving a
        template needs an admin key. The sandbox must be running. Supported
        on the docker backend only, and needs /bin/sh, tar, and cp in the image.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                template: {type: string, description: Also save the image as a template with this name.}
                description: {type: string, description: Description of that template.}
      responses:
        "201":
          description: Snapshot taken
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Snapshot"}
        "400":
          description: The backend cannot snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "403":
          description: Snapshots need build rights, and templates an admin key
        "409":
          description: The sandbox is not running, or the template exists
  /v1/sandboxes/{id}/resume:
    post:
      operationId: resumeSandbox
      summary: Resume a sandbox
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Running sandbox
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Sandbox"}
  /v1/sandboxes/{id}/exec:
    post:
      operationId: execSandbox
      summary: Run a command
      description: |
        Waits for the process and returns stdout, stderr, and the exit code.
        `?stream=1` switches the response to Server-Sent Events (`stdout`,
        `stderr`, `exit`, `error`).
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - in: query
          name: stream
          schema: {type: string, enum: ["1", "true"]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExecRequest"}
      responses:
        "200":
          description: Exec result, or an SSE stream when stream=1
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExecResult"}
            text/event-stream:
              schema: {type: string}
  /v1/sandboxes/{id}/files:
    get:
      operationId: listFiles
      summary: List a directory
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileList"}
    delete:
      operationId: deleteFile
      summary: Delete a file or directory
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/Path"
      responses:
        "204": {description: Deleted}
  /v1/sandboxes/{id}/files/content:
    get:
      operationId: downloadFile
      summary: Download a file
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: Raw file bytes
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
    put:
      operationId: uploadFile
      summary: Upload a file
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/Path"
        - in: query
          name: mode
          schema: {type: string, example: "644"}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "204": {description: Written}
  /v1/sandboxes/{id}/files/archive:
    get:
      operationId: downloadArchive
      summary: Download a directory as tar.gz
      description: gzip-compressed tar. When sbx-agent is configured the archive is packed in the agent, so the image does not need tar.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: gzip-compressed tar
          content:
            application/gzip:
              schema: {type: string, format: binary}
    post:
      operationId: uploadArchive
      summary: Extract a tar or tar.gz into a directory
      description: Accepts a tar or gzip-compressed tar. When sbx-agent is configured, extraction runs in the agent and does not call tar. Paths that leave the destination are kept inside it. The archive may be up to max_archive_bytes (256 MiB by default) both as sent and after gunzip; a larger one gets 413 payload_too_large.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/Path"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "204": {description: Extracted}
  /v1/sandboxes/{id}/files/stat:
    get:
      operationId: statFile
      summary: Stat one path
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FileEntry"}
        "400":
          description: Agent is not enabled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
  /v1/sandboxes/{id}/files/mkdir:
    post:
      operationId: mkdir
      summary: Create a directory
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: {type: string}
                mode: {type: string, example: "755"}
      responses:
        "204": {description: Created}
  /v1/sandboxes/{id}/files/watch:
    get:
      operationId: watchFiles
      summary: Watch a directory
      description: |
        Server-Sent Events. `ready`, then `change` events with `type`
        (`create`, `write`, or `remove`) and `path`. The agent uses inotify
        and falls back to a 200 ms poll when inotify is unavailable.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/Path"
        - in: query
          name: recursive
          schema: {type: string, enum: ["1", "true"]}
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
  /v1/sandboxes/{id}/processes:
    post:
      operationId: createProcess
      summary: Start a background process
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExecRequest"}
      responses:
        "201":
          description: Running process
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Process"}
    get:
      operationId: listProcesses
      summary: List tracked processes
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Processes
          content:
            application/json:
              schema:
                type: object
                required: [processes]
                properties:
                  processes:
                    type: array
                    items: {$ref: "#/components/schemas/Process"}
  /v1/sandboxes/{id}/processes/{procId}:
    get:
      operationId: getProcess
      summary: Get one process
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/ProcID"
      responses:
        "200":
          description: Process
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Process"}
    delete:
      operationId: deleteProcess
      summary: Kill a process
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/ProcID"
      responses:
        "204": {description: Signaled}
  /v1/sandboxes/{id}/processes/{procId}/signal:
    post:
      operationId: signalProcess
      summary: Signal a process
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/ProcID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signal]
              properties:
                signal: {type: string, enum: [TERM, KILL, INT, HUP, QUIT]}
      responses:
        "204": {description: Delivered}
  /v1/sandboxes/{id}/processes/{procId}/stdin:
    post:
      operationId: processStdin
      summary: Write to a process without closing stdin
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/ProcID"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "204": {description: Written}
  /v1/sandboxes/{id}/processes/{procId}/stream:
    get:
      operationId: streamProcess
      summary: Follow a process
      description: Server-Sent Events (`stdout`, `stderr`, `exit`, `error`), including output buffered before the call.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/ProcID"
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
  /v1/sandboxes/{id}/terminals:
    post:
      operationId: createTerminal
      summary: Start an interactive terminal
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TerminalRequest"}
      responses:
        "201":
          description: Terminal
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Terminal"}
  /v1/sandboxes/{id}/terminals/{termId}:
    delete:
      operationId: deleteTerminal
      summary: Kill a terminal
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/TermID"
      responses:
        "204": {description: Signaled}
  /v1/sandboxes/{id}/terminals/{termId}/resize:
    post:
      operationId: resizeTerminal
      summary: Resize a terminal
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/TermID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cols, rows]
              properties:
                cols: {type: integer}
                rows: {type: integer}
      responses:
        "204": {description: Resized}
  /v1/sandboxes/{id}/terminals/{termId}/ws:
    get:
      operationId: terminalSocket
      summary: Attach to a terminal
      description: |
        WebSocket. Binary frames are stdin and output. Text frames are JSON.
        The client sends `{"type":"resize","cols":80,"rows":24}`. The server
        sends `{"type":"exit","exit_code":0}` when the process ends.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/TermID"
      responses:
        "101": {description: WebSocket upgrade}
  /v1/sandboxes/{id}/previews:
    post:
      operationId: createPreview
      summary: Publish a loopback port
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              properties:
                port: {type: integer, minimum: 1, maximum: 65535}
                public:
                  type: boolean
                  description: >
                    When true, the port can be opened without a credential if
                    the operator has not disabled public previews. A one-time
                    token is still returned.
      responses:
        "201":
          description: Preview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preview"}
    get:
      operationId: listPreviews
      summary: List previews
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Previews
          content:
            application/json:
              schema:
                type: object
                required: [previews]
                properties:
                  previews:
                    type: array
                    items: {$ref: "#/components/schemas/Preview"}
  /v1/sandboxes/{id}/previews/{previewId}:
    delete:
      operationId: deletePreview
      summary: Remove a preview
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/PreviewID"
      responses:
        "204": {description: Removed}
  /v1/sandboxes/{id}/previews/{previewId}/:
    get:
      operationId: proxyPreview
      summary: Proxy to the previewed port
      description: |
        Every method under this prefix is forwarded to the sandbox loopback
        port. The preview id segment is stripped. Upgrade requests are spliced.
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/PreviewID"
      responses:
        "200": {description: Upstream response}
  /p/{sandboxId}/{port}/:
    get:
      security: []
      operationId: proxyPublicPreview
      summary: Proxy a preview from the public path
      description: |
        Path form `/p/{sandboxId}/{port}/...`. A public preview needs no
        credential. Otherwise send `X-Sbx-Preview-Token`, `?token=`, or a
        sandbox API key that owns the sandbox. The same handler serves
        `Host: <port>-sbx-<16 hex>.<preview_domain>` when the operator sets
        `network.preview_domain`. The server talks HTTP/1.1 to the sandbox so
        WebSocket upgrades work. Terminate TLS and HTTP/2 at the reverse proxy
        and forward `Host` and `Upgrade`. See docs/NETWORK.md.
      parameters:
        - name: sandboxId
          in: path
          required: true
          schema: {type: string}
        - name: port
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200": {description: Upstream response}
        "401": {description: Preview is not public and no token was accepted}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: API key issued by sbx, prefixed with sbx_.
    accessToken:
      type: apiKey
      in: query
      name: access_token
      description: Same API key, for browsers and WebSocket clients.
  parameters:
    SandboxID:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^sbx_[0-9a-f]{16}$"}
    VolumeID:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^vol_[0-9a-f]{16}$"}
    ProcID:
      name: procId
      in: path
      required: true
      schema: {type: string}
    TermID:
      name: termId
      in: path
      required: true
      schema: {type: string}
    PreviewID:
      name: previewId
      in: path
      required: true
      schema: {type: string, pattern: "^prv_[0-9a-f]{16}$"}
    TemplateName:
      name: name
      in: path
      required: true
      schema: {type: string}
    Path:
      name: path
      in: query
      required: true
      schema: {type: string}
      description: Absolute path inside the sandbox.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    Health:
      type: object
      required: [status, version, backend, docker]
      properties:
        status: {type: string}
        version: {type: string}
        backend: {type: string}
        docker: {type: string}
    APIKey:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        prefix: {type: string}
        scopes:
          type: array
          items: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at:
          type: string
          format: date-time
          description: Updated at most once a minute.
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        network: {$ref: "#/components/schemas/KeyNetwork"}
    CreateKey:
      type: object
      required: [name]
      properties:
        name: {type: string}
        scopes:
          type: array
          items: {type: string, enum: [admin, sandbox]}
        expires_at:
          type: string
          format: date-time
          description: Optional. Must be in the future. The key stops authenticating at this time.
        network: {$ref: "#/components/schemas/KeyNetwork"}
    KeyNetwork:
      type: object
      description: >
        Network policy for sandboxes created with this key. mode and allow are
        defaults a sandbox may override unless max_mode is set.
      properties:
        mode: {type: string, enum: [none, full, allow]}
        max_mode:
          type: string
          enum: [none, allow, full]
          description: >
            Optional ceiling. A sandbox asking for a looser mode gets 403, a
            looser server default is narrowed to it, and under allow every
            sandbox allow entry must fall inside this key's allow list (which
            is then required).
        allow:
          type: array
          items: {type: string}
          description: Replaces a less specific allow list. An empty array clears it.
        deny:
          type: array
          items: {type: string}
          description: Unioned with the server deny list. A sandbox cannot remove these.
        egress_kbps: {type: integer, minimum: 0}
        max_connections: {type: integer, minimum: 0}
    CreatedKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key: {type: string, description: Shown once.}
    Template:
      type: object
      required: [name, image, builtin]
      properties:
        name: {type: string}
        image: {type: string}
        description: {type: string}
        cpu: {type: number}
        memory_mb: {type: integer}
        disk_mb: {type: integer}
        env: {type: object, additionalProperties: {type: string}}
        backend:
          type: string
          description: Default backend for sandboxes created from this template. Empty uses the server default.
        network:
          type: string
          enum: [none, full]
          description: Default sandbox network when create omits network. none is the default.
        setup:
          type: array
          items: {type: string}
          description: Command run once before a warm sandbox is offered, and on a cold create.
        setup_timeout_seconds: {type: integer}
        warm:
          type: integer
          minimum: 0
          maximum: 8
          description: How many ready sandboxes to keep for this template.
        steps:
          type: array
          items: {$ref: "#/components/schemas/BuildStep"}
          description: Build steps applied to image. Sandboxes start from the built image.
        builtin: {type: boolean}
        created_at: {type: string, format: date-time}
    Backend:
      type: object
      required: [name, available, isolation, pause, snapshot, exec, pty, files, watch, preview, networks, requirements]
      properties:
        name: {type: string}
        available: {type: boolean}
        detail: {type: string}
        isolation: {type: string, description: container, gvisor, kata, or firecracker}
        pause: {type: boolean}
        snapshot: {type: boolean}
        exec: {type: boolean}
        pty: {type: boolean}
        files: {type: boolean}
        watch: {type: boolean}
        preview: {type: boolean}
        networks:
          type: array
          items: {type: string, enum: [none, full, allow]}
        requirements:
          type: array
          items: {type: string}
    CreateTemplate:
      type: object
      required: [name, image]
      properties:
        name: {type: string}
        image: {type: string}
        description: {type: string}
        cpu: {type: number}
        memory_mb: {type: integer}
        disk_mb: {type: integer}
        env: {type: object, additionalProperties: {type: string}}
        backend:
          type: string
          description: Default backend for sandboxes created from this template.
        network: {type: string, enum: [none, full]}
        setup: {type: array, items: {type: string}}
        setup_timeout_seconds: {type: integer}
        warm: {type: integer, minimum: 0, maximum: 8}
        steps:
          type: array
          maxItems: 64
          items: {$ref: "#/components/schemas/BuildStep"}
          description: Built when the template is created, so a failing step fails the request.
    BuildStep:
      type: object
      description: >
        Exactly one field is set. run is a /bin/sh -c script run as root.
        packages installs with apt-get, apk, dnf, or yum, whichever the base
        has. env sets build-time variables for later steps; they are not set
        in sandboxes. workdir sets the directory later steps run in; it
        cannot be under /workspace, which is mounted over at runtime.
      properties:
        run: {type: string, maxLength: 65536}
        packages:
          type: array
          minItems: 1
          maxItems: 64
          items: {type: string}
        env: {type: object, additionalProperties: {type: string}}
        workdir: {type: string}
    Build:
      type: object
      required: [id, image, base, steps, cached, duration_ms]
      properties:
        id:
          type: string
          description: Content hash of the base and the rendered steps. Empty when no step runs a command.
        image: {type: string, description: Image sandboxes start from, sbx-template:<id>.}
        base: {type: string}
        steps:
          type: array
          items: {$ref: "#/components/schemas/BuildStep"}
        cached: {type: boolean}
        duration_ms: {type: integer}
    Snapshot:
      type: object
      required: [id, image, sandbox_id, base, workspace, template, duration_ms]
      properties:
        id: {type: string, description: snap_<16 hex chars>.}
        image: {type: string, description: Image sandboxes start from, sbx-template:<id>.}
        sandbox_id: {type: string}
        base: {type: string, description: Image the sandbox was started from.}
        workspace: {type: boolean, description: Whether /workspace was copied into the image.}
        template:
          description: The template saved from the snapshot, or null.
          oneOf:
            - $ref: "#/components/schemas/Template"
            - type: "null"
        duration_ms: {type: integer}
    Network:
      type: object
      properties:
        mode:
          type: string
          enum: [none, full, allow]
          description: >
            none attaches no network. full grants public egress. allow is full
            plus a required allow list. The server default and the API key
            default apply when this is omitted. Metadata and private ranges
            stay blocked unless the operator opts out. Firecracker uses a
            per-VM tap for full and allow, enforces the IPv4 allow, deny, and
            block rules, and does not enforce bandwidth.
        allow:
          type: array
          items: {type: string}
          description: >
            Most specific allow list wins. Entries are hostnames, IPs, or
            CIDRs. Wildcards are rejected. An empty array clears a key or
            server allow list.
        deny:
          type: array
          items: {type: string}
          description: Unioned with the server and API key deny lists.
        egress_kbps:
          type: integer
          minimum: 0
          description: Tightest positive limit wins. 0 inherits or means unlimited. Firecracker rejects a positive limit.
        max_connections:
          type: integer
          minimum: 0
          description: Tightest positive connlimit wins. 0 inherits or means unlimited.
    CreateSandbox:
      type: object
      properties:
        template: {type: string}
        image: {type: string}
        cpu: {type: number}
        memory_mb: {type: integer}
        disk_mb:
          type: integer
          description: >
            Size of the `/workspace` tmpfs. Does not cap `/workspace` when a
            volume is mounted there.
        pids: {type: integer}
        ttl_seconds: {type: integer}
        idle_timeout_seconds: {type: integer}
        env: {type: object, additionalProperties: {type: string}}
        network: {$ref: "#/components/schemas/Network"}
        backend: {type: string, enum: [docker, gvisor, kata, firecracker]}
        labels: {type: object, additionalProperties: {type: string}}
        mounts:
          type: array
          maxItems: 8
          description: >
            Volumes to attach. Mount `/workspace` to persist the project
            directory; `disk_mb` then does not cap that path. Paths under
            `/workspace/` are rejected. `/tmp`, `/opt/sbx`, `/proc`, `/sys`,
            `/dev`, and `/etc` are reserved.
          items: {$ref: "#/components/schemas/Mount"}
        secrets:
          type: object
          additionalProperties: {type: string}
          description: >
            Environment variables stored for the sandbox but never returned by
            get or list. Names appear in secret_keys. They are injected into
            the container and into later execs. A name cannot also be set in env.
        steps:
          type: array
          items: {$ref: "#/components/schemas/BuildStep"}
          description: >
            Build steps run after the template's own steps, on image (or the
            template's image). The result is cached by content hash, so only
            the first create with a given base and steps builds. Needs an
            admin key unless builds.allow_sandbox_keys is set. So does setting
            image on a template that has steps, since that is a new build;
            otherwise the request is rejected with 403. A create with steps
            does not take a warm sandbox.
    Mount:
      type: object
      required: [volume_id, path]
      properties:
        volume_id: {type: string}
        path:
          type: string
          description: Absolute path inside the sandbox. No `..`.
    CreateVolume:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique per API key. Starts with a letter or digit.
        backend: {type: string, enum: [docker, gvisor, kata]}
        if_exists:
          type: string
          enum: [error, reuse]
          default: error
          description: >
            What to do when the key already has a volume with this name.
            error returns 409. reuse returns that volume, or 409 if it is on
            another backend.
    Volume:
      type: object
      required: [id, name, backend, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        backend: {type: string}
        created_at: {type: string, format: date-time}
    Sandbox:
      type: object
      required: [id, status, backend, image, expires_at, node]
      properties:
        id: {type: string}
        status: {type: string, enum: [creating, running, paused, stopped, error, warm]}
        backend: {type: string}
        template: {type: string}
        image: {type: string}
        cpu: {type: number}
        memory_mb: {type: integer}
        disk_mb:
          type: integer
          description: >
            Size of the `/workspace` tmpfs, and the cap shared with `/tmp`.
            A volume mounted at `/workspace` replaces that tmpfs, so this
            limit does not apply to the persisted workspace.
        pids: {type: integer}
        network: {type: string, enum: [none, full, allow]}
        egress_allow: {type: array, items: {type: string}}
        egress_deny: {type: array, items: {type: string}}
        egress_kbps: {type: integer}
        max_connections: {type: integer}
        mounts:
          type: array
          items: {$ref: "#/components/schemas/Mount"}
        env: {type: object, additionalProperties: {type: string}}
        labels: {type: object, additionalProperties: {type: string}}
        secret_keys:
          type: array
          items: {type: string}
          description: Names of secrets set on this sandbox. Values are not returned.
        idle_timeout_seconds: {type: integer}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        node: {type: string}
    ExecRequest:
      type: object
      required: [cmd]
      properties:
        cmd:
          type: array
          items: {type: string}
          minItems: 1
        cwd: {type: string}
        env: {type: object, additionalProperties: {type: string}}
        timeout_seconds: {type: integer, description: Background processes may use 0 for no timeout.}
        stdin: {type: string, description: UTF-8 stdin. Mutually exclusive with stdin_base64.}
        stdin_base64: {type: string, description: Base64 stdin. Mutually exclusive with stdin.}
    ExecResult:
      type: object
      required: [exit_code, stdout, stderr, duration_ms, truncated]
      properties:
        exit_code: {type: integer}
        stdout: {type: string}
        stderr: {type: string}
        duration_ms: {type: integer}
        truncated: {type: boolean}
    FileEntry:
      type: object
      required: [name, path, type, size]
      properties:
        name: {type: string}
        path: {type: string}
        type: {type: string, enum: [file, dir, symlink]}
        size: {type: integer}
        mode: {type: string}
        mtime: {type: string, format: date-time}
    FileList:
      type: object
      required: [path, entries]
      properties:
        path: {type: string}
        entries:
          type: array
          items: {$ref: "#/components/schemas/FileEntry"}
    Process:
      type: object
      required: [id, pid, cmd, status, exit_code]
      properties:
        id: {type: string}
        pid: {type: integer}
        cmd: {type: array, items: {type: string}}
        cwd: {type: string}
        tty: {type: boolean}
        status: {type: string, enum: [running, exited]}
        exit_code: {type: integer}
        started_at: {type: string, format: date-time}
    TerminalRequest:
      type: object
      required: [cmd]
      properties:
        cmd: {type: array, items: {type: string}, minItems: 1}
        cwd: {type: string}
        env: {type: object, additionalProperties: {type: string}}
        cols: {type: integer}
        rows: {type: integer}
    Terminal:
      type: object
      required: [id, pid, cols, rows]
      properties:
        id: {type: string}
        pid: {type: integer}
        cols: {type: integer}
        rows: {type: integer}
    Preview:
      type: object
      required: [id, sandbox_id, port, url, public]
      properties:
        id: {type: string}
        sandbox_id: {type: string}
        port: {type: integer}
        public: {type: boolean}
        url: {type: string, description: Authenticated /v1 proxy URL.}
        public_url: {type: string, description: Path or wildcard-host URL. Includes the token once when the preview is not public.}
        host: {type: string, description: Present when preview_domain is configured.}
        token: {type: string, description: Shown once, on create.}
        created_at: {type: string, format: date-time}
